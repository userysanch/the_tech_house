<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — The Tech House</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #1B2850 0%, #092C4C 50%, #1B2850 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Nunito', sans-serif;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
            overflow: hidden;
            width: 100%;
            max-width: 420px;
        }
        .login-header {
            background: var(--primary, #FE9F43);
            padding: 2rem;
            text-align: center;
            color: #fff;
        }
        .login-header .logo-icon {
            width: 64px;
            height: 64px;
            background: rgba(255,255,255,.2);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: .75rem;
        }
        .login-header h4 {
            color: #fff;
            font-weight: 700;
            margin: 0;
        }
        .login-header p {
            color: rgba(255,255,255,.8);
            font-size: .85rem;
            margin: .25rem 0 0;
        }
        .login-body {
            padding: 2rem;
        }
        .login-body .form-label {
            font-size: .8rem;
            font-weight: 600;
            color: #646B72;
        }
        .login-body .form-control {
            border: 1px solid #E6EAED;
            border-radius: 8px;
            padding: .65rem .75rem;
            font-size: .9rem;
        }
        .login-body .form-control:focus {
            border-color: #FE9F43;
            box-shadow: 0 0 0 3px rgba(254,159,67,.15);
        }
        .login-body .input-group-text {
            background: #F9FAFB;
            border: 1px solid #E6EAED;
            border-radius: 8px 0 0 8px;
            color: #646B72;
        }
        .login-body .input-group .form-control {
            border-radius: 0 8px 8px 0;
        }
        .btn-login {
            background: #FE9F43;
            border: none;
            color: #fff;
            font-weight: 700;
            font-size: .9rem;
            padding: .65rem;
            border-radius: 8px;
            width: 100%;
            transition: all .3s;
        }
        .btn-login:hover {
            background: rgb(253, 140, 31);
            color: #fff;
            box-shadow: 0 4px 15px rgba(254,159,67,.4);
        }
        .alert-dp {
            border-radius: 8px;
            font-size: .85rem;
        }
        .users-hint {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #F9FAFB;
            border-radius: 8px;
            border: 1px solid #E6EAED;
        }
        .users-hint h6 {
            font-size: .75rem;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: #646B72;
            margin-bottom: .5rem;
        }
        .users-hint .user-row {
            display: flex;
            justify-content: space-between;
            font-size: .8rem;
            padding: .25rem 0;
        }
        .users-hint .user-row .user-tag {
            background: rgba(254,159,67,.1);
            color: #FE9F43;
            padding: .1rem .4rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: .7rem;
        }
        .users-hint .user-row .emp-tag {
            background: rgba(62,183,128,.1);
            color: #3EB780;
            padding: .1rem .4rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: .7rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="logo-icon">
                <i class="ti ti-building-store"></i>
            </div>
            <h4>The Tech House</h4>
            <p>Sistema POS — Inicia sesion</p>
        </div>
        <div class="login-body">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert-dp alert-dp-{{ category }}" style="margin-bottom:1rem;">
                            <i class="ti {% if category == 'success' %}ti-circle-check-filled{% elif category == 'danger' %}ti-circle-x-filled{% elif category == 'warning' %}ti-alert-triangle-filled{% else %}ti-info-circle-filled{% endif %}"></i>
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="ti ti-user"></i></span>
                        <input type="text" class="form-control" name="username" placeholder="Tu usuario" required autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contrasena</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="ti ti-lock"></i></span>
                        <input type="password" class="form-control" name="password" placeholder="Tu contrasena" required>
                    </div>
                </div>
                <button type="submit" class="btn-login">
                    <i class="ti ti-login"></i> Iniciar Sesion
                </button>
            </form>

            <div class="users-hint">
                <h6>Usuarios de prueba</h6>
                <div class="user-row">
                    <span><strong>admin</strong> / admin123</span>
                    <span class="user-tag">Admin</span>
                </div>
                <div class="user-row">
                    <span><strong>vendedor</strong> / vendedor123</span>
                    <span class="emp-tag">Empleado</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
